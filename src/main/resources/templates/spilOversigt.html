<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Spil Læs Mere</title>
    <link rel="stylesheet" href="/css/colors.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/customStyle.css">
    <link rel="stylesheet" href="/css/beertoggle.css">
</head>
<header class="background">

    <!-- Top bar -->
    <div class="top-nav">
        <div class="logo">
            <img class="logoImage" src="/assets/logo.png" alt="Logo"/>
        </div>
        <div class="søgContainer">
            <input type="text" placeholder="Søg..." name="søg"/>
            <button type="submit">Søg</button>
        </div>

        <!-- Opret/Log ind formular-->

        <div class="brugerLink" th:if="${session.loggedInUser == null}">
            <form method="POST" action="/login">

                <label for="username">Brugernavn</label>
                <input type="text" id="username" placeholder="Brugernavn" name="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password" name="password" required>

                <input type="submit" value="Log ind">
            </form>
            <div class="errorMessage" th:unless="${session.errorMessage == null}">
                <p th:text="${session.errorMessage}">Fejlbesked</p>
            </div>
            <form method="GET" action="/registerButton">
                <button class="registerButton" type="submit">Opret bruger</button>
            </form>

        </div>

        <div class="brugerLink" th:unless="${session.loggedInUser == null}">
            <p>Welcome <span th:text="${session.loggedInUser.username}">username</span></p>
            <form method="post" action="/logout"><button type="submit">Log ud</button></form>
        </div>


    </div>
</header>

<body>
<div class="oversigtContainer">
    <div class="spilFiltre">
        <form>
            <div class="filter" id="kategorier">
                <p>Kategorier:</p>

                <input type="checkbox" id="strategi" name="kategori" value="Strategi"/>
                <label for="strategi">Strategi</label><br/>

                <input type="checkbox" id="leg" name="kategori" value="Leg"/>
                <label for="leg">Leg</label><br/>

                <input type="checkbox" id="terning" name="kategori" value="Terning"/>
                <label for="terning">Terning</label><br/>

                <input type="checkbox" id="kort" name="kategori" value="Kort"/>
                <label for="kort">Kort</label><br/>
            </div>
            <div class="filter" id="antalSpillere">
                <p>Antal spillere:</p>
                <input type="range" id="antalSpillereSlider" name="antalSpillereSlider" min="1" max="12" value="4"
                       oninput="antal.value=antalSpillereSlider.value"/>
                <output id="antal" name="antal" for="antalSpillereSlider">4</output>
                <label for="antalSpillereSlider" hidden="hidden">Antal spillere (mellem 1 og 12)</label>
            </div>
            <div class="filter" id="varighed">
                <p>Anslået varighed:</p>

                <input type="checkbox" id="0-15" name="varighed" value="0-15"/>
                <label for="0-15">0-15 minutter</label><br/>
                <input type="checkbox" id="15-30" name="varighed" value="15-30"/>
                <label for="15-30">15-30 minutter</label><br/>
                <input type="checkbox" id="30-45" name="varighed" value="30-45"/>
                <label for="30-45">30-45 minutter</label><br/>
                <input type="checkbox" id="45-60" name="varighed" value="45-60"/>
                <label for="45-60">45-60 minutter</label><br/>
                <input type="checkbox" id="60+" name="varighed" value="60+"/>
                <label for="60+">60+ minutter</label>
            </div>
            <div class="filterKnapper">
                <button type="reset">Nulstil</button>
                <button type="submit">Filtrer</button>
            </div>
        </form>

    </div>
    <div class="gridContainer">

        <div class="spil" th:each="game : ${gameList}" th:text="${game.name}"></div>


        <div id="modal" class="modal">
            <div class="modal-content">
                <button class="closeModalKnap">X</button>

                <iframe id="modalIframe"></iframe>

            </div>
        </div>


    </div>

</div>


<script src="/js/spilOversigt.js" defer></script>
</body>
</html>
