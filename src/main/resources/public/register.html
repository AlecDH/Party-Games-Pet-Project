<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Opret bruger</title>
</head>
<body>

<div class="formula">
    <form method="POST" action="/register">

        <label for="username">Brugernavn</label>
        <input type="text" id="username" placeholder="Brugernavn" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" name="password" required>

        <label for="password-repeat">Repeat password</label>
        <input type="password" id="password-repeat" placeholder="Gentag password" name="password-repeat" required>

        <button type="submit" class="">Opret bruger</button>
    </form>
</div>

</body>
</html>
